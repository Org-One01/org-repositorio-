name: Desplegar Pagina con Suma y Render

on:
  push:
    branches:
      - main # Asegúrate de que coincida con tu rama principal (main o master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Job para construir y subir los archivos estáticos
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar el archivo HTML
        run: python src/generar-pagina.py

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  # 2. Job para publicar el sitio web en GitHub Pages y notificar a Render
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Activar Despliegue en Render y Mostrar Enlace
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "=================================================="
          echo "🚀 Despliegue activado en Render exitosamente."
          echo "🔗 Enlace de tu aplicación en Render:"
          echo "https://org-repositorio.onrender.com"
          echo "=================================================="