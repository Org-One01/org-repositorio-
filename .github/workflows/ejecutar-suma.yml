name: Ejecutar Suma

on:
  push:
    branches:
      - main # Asegúrate de que el nombre coincida con tu rama principal (main o master)

jobs:
  suma-job:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar el script
        run: python src/suma.py